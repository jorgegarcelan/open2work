<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OPEN2WORK — tu carrera en IA, post a post</title>
<link rel="icon" type="image/svg+xml" href="assets/brand/open2work-icon.svg">
<link rel="preload" as="image" href="assets/brand/open2work-logo-v2.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F2EE; --card:#FFFFFF; --line:#E0DFDC; --line2:#D6D4D0;
  --text:#1B1F23; --dim:#666666; --dim2:#8C8C8C;
  --blue:#16B86A; --blue2:#0E6B45; --green:#0E8A5F; --brand-green:#16B86A;
  --brand-ink:#14201B; --red:#CC1016; --gold:#B7770D; --purple:#7A3FD1;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Inter",-apple-system,sans-serif;font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
.num{font-variant-numeric:tabular-nums}

/* ═══ LAYOUT ═══ */
.wrap{max-width:1040px;margin:0 auto;padding:14px 12px 80px;
  display:grid;grid-template-columns:280px 1fr;gap:16px;align-items:start}
.rail{position:sticky;top:14px;display:flex;flex-direction:column;gap:12px}
@media(max-width:820px){
  .wrap{grid-template-columns:1fr;padding-top:10px}
  .rail{position:static}
  .railcards{display:grid;grid-template-columns:1fr;gap:12px}
}

/* ═══ TARJETAS BASE ═══ */
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}

/* ═══ PERFIL (rail) ═══ */
.pcover{height:56px;background:linear-gradient(120deg,#0E8A5F,#43C987 60%,#8DDEB3)}
.pbody{padding:0 16px 14px;margin-top:-26px}
.pavatar{width:60px;height:60px;border-radius:50%;background:#fff;border:3px solid #fff;
  display:grid;place-items:center;font-weight:800;font-size:22px;color:#fff;
  background:linear-gradient(135deg,#16B86A,#0E6B45)}
.pname{font-weight:700;font-size:16.5px;margin-top:7px}
.phead{font-size:12.5px;color:var(--text);margin-top:1px}
.psub{font-size:11.5px;color:var(--dim);margin-top:2px}
.pbadge{display:inline-block;background:#E7F5EE;color:var(--blue);border:1px solid #BFE3CF;
  font-size:10.5px;font-weight:700;border-radius:5px;padding:1px 7px;margin-top:6px}
.pbadge.mg{background:#FBF3E4;color:var(--gold);border-color:#EFDFB9}
.pstats{border-top:1px solid var(--line);margin-top:11px;padding-top:9px;display:grid;gap:5px}
.pstat{display:flex;justify-content:space-between;font-size:12px}
.pstat span{color:var(--dim)}
.pstat b{font-weight:700}
.pstat b.gr{color:var(--green)}
.quickstats{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:11px}
.quickstat{background:#F7F6F4;border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}
.quickstat span{display:block;color:var(--dim2);font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase}
.quickstat b{display:block;margin-top:1px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quickstat.energy b{color:var(--green)}
.quickstat.energy.low b{color:var(--red)}
.marketline{margin-top:8px;padding:7px 9px;border-radius:8px;background:#F7F6F4;font-size:11px;color:var(--dim)}
.marketline b{color:var(--text)}
.profile-more{border-top:1px solid var(--line);margin-top:10px;padding-top:9px}
.profile-more summary{list-style:none;cursor:pointer;text-align:center;color:var(--dim);font-size:11.5px;font-weight:700}
.profile-more summary::-webkit-details-marker{display:none}
.profile-more[open] summary{margin-bottom:8px;color:var(--text)}
.mini-meters{border-top:1px solid var(--line);margin-top:10px;padding-top:10px;display:grid;gap:7px}
.mm .t{display:flex;justify-content:space-between;font-size:10.5px;color:var(--dim);margin-bottom:2px;font-weight:600}
.mm .bar{height:5px;background:#EDEBE7;border-radius:3px;overflow:hidden}
.mm .bar i{display:block;height:100%;border-radius:3px;transition:width .4s}
.mm.tec i{background:var(--blue)}.mm.rep i{background:var(--gold)}
.mm.red i{background:var(--purple)}.mm.ene i{background:var(--green)}
.mm.warn i{background:var(--red)!important}
.sideline{border-top:1px solid var(--line);margin-top:10px;padding-top:8px;font-size:11.5px;color:var(--dim)}
.sideline b{color:var(--text)}

/* experiencia */
.xp{border-top:1px solid var(--line);margin-top:11px;padding-top:10px}
.xp .xh{font-size:12px;font-weight:800;margin-bottom:8px}
.xpi{display:flex;gap:9px;margin-bottom:9px;align-items:flex-start}
.xpi:last-child{margin-bottom:0}
.xpi .xav{width:30px;height:30px;border-radius:5px;flex:0 0 30px;display:grid;place-items:center;
  font-weight:800;font-size:12px;color:#fff}
.xpi .xr{font-size:12px;font-weight:700;line-height:1.25}
.xpi .xc{font-size:11.5px;color:var(--text)}
.xpi .xd{font-size:11px;color:var(--dim2)}
.xpi.now .xr::after{content:'· Actual';color:var(--green);font-weight:700;font-size:10px;margin-left:4px}

/* mercado (rail) */
.mkcard{padding:11px 14px;font-size:12px}
.mkcard .k{font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--dim2);text-transform:uppercase;margin-bottom:4px}
.mkcard .v{font-weight:700;font-size:13px}
.mkcard .d{color:var(--dim);margin-top:2px;font-size:11.5px}
.mk-boom .v{color:var(--green)}.mk-est .v{color:var(--blue)}.mk-inv .v{color:var(--red)}
.mk-reg .v{color:var(--gold)}.mk-agi .v{color:var(--purple)}

/* ═══ FEED ═══ */
.feedcol{display:flex;flex-direction:column;gap:10px;min-width:0}
.retirebtn{background:none;border:none;color:var(--dim2);font-size:11.5px;text-decoration:underline;padding:6px}

/* siguiente proyecto: el bucle principal de la carrera */
.careerpick{background:var(--card);border:1.5px solid var(--blue);border-radius:11px;padding:14px}
.careerhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:11px}
.careerhead span{display:block;color:var(--blue);font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.careerhead b{display:block;margin-top:2px;font-size:17px;line-height:1.2}
.careerhead em{font-style:normal;color:var(--dim2);font-size:11px;white-space:nowrap}
.careeropts{display:grid;gap:7px}
.careeropt{display:flex;align-items:center;gap:10px;width:100%;background:#fff;border:1.5px solid var(--line2);
  border-radius:9px;padding:10px 11px;text-align:left;transition:border-color .12s,transform .12s}
.careeropt:hover{border-color:var(--blue);transform:translateY(-1px)}
.careeropt .ico{width:34px;height:34px;flex:0 0 34px;border-radius:8px;background:#E7F5EE;display:grid;place-items:center;font-size:18px}
.careeropt .copy{min-width:0;flex:1}
.careeropt .kind{display:block;color:var(--green);font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.careeropt b{display:block;font-size:13.5px;margin-top:1px}
.careeropt small{display:block;color:var(--dim);font-size:11.5px;line-height:1.3;margin-top:1px}
.careeropt .arr{color:var(--blue);font-size:20px;font-weight:800}
.cyclecard{background:#14201B;color:#fff;border-radius:9px;padding:9px 11px;margin-bottom:8px;display:flex;align-items:center;gap:9px}
.cyclecard .years{font-size:11px;font-weight:800;color:#8DDEB3;white-space:nowrap}
.cyclecard .summary{font-size:11.5px;line-height:1.35;min-width:0}
.cyclecard .summary b{color:#fff}
.cyclecard .deltas{display:block;color:#B9C7C0;font-size:10.5px;margin-top:1px}

/* post */
.post{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px 15px 9px;animation:fi .3s ease}
.post.past{cursor:pointer;padding:9px 12px;opacity:.72;animation:none}
.post.past:not(.expanded) .ptxt,.post.past:not(.expanded) .vermas,
.post.past:not(.expanded) .preact,.post.past:not(.expanded) .pcomments,
.post.past:not(.expanded)>div[style]{display:none}
.post.past:not(.expanded) .pav{width:30px;height:30px;flex-basis:30px;font-size:10px}
.post.past:not(.expanded) .pwho .h{display:none}
.post.past:not(.expanded)::after{content:'Ver post';display:block;margin:3px 0 0 39px;color:var(--dim2);font-size:10px;font-weight:700}
.post.past.expanded{opacity:1}
@keyframes fi{from{opacity:0;transform:translateY(8px)}}
.phd2{display:flex;gap:9px;align-items:flex-start}
.pav{width:42px;height:42px;border-radius:50%;flex:0 0 42px;display:grid;place-items:center;
  font-weight:800;font-size:15px;color:#fff}
.pav.sq{border-radius:7px}
.pwho{min-width:0;flex:1}
.pwho .n{font-weight:700;font-size:13.5px;line-height:1.2}
.pwho .n small{font-weight:400;color:var(--dim2);font-size:12px}
.pwho .h{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pwho .t{font-size:11px;color:var(--dim2)}
.ptxt{margin:9px 0 6px;font-size:13.5px;white-space:pre-line}
.ptxt b{font-weight:700}
.ptag{display:inline-block;font-size:10.5px;font-weight:700;border-radius:5px;padding:1px 7px;margin-bottom:6px}
.ptag.g{background:#E7F5EE;color:var(--green)}
.ptag.r{background:#FBE9EA;color:var(--red)}
.ptag.o{background:#FBF3E4;color:var(--gold)}
.ptag.p{background:#F1E9FC;color:var(--purple)}
.ptag.b{background:#E7F5EE;color:var(--blue)}
.preact{border-top:1px solid var(--line);margin-top:8px;padding-top:6px;
  display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim2)}
.preact .ic{letter-spacing:-2px;margin-right:4px}

/* decisión = encuesta */
.poll{border:1.5px solid var(--blue)}
.poll .ptxt{margin-bottom:10px}
.pollopts{display:grid;gap:7px;margin-bottom:8px}
.pollopt{position:relative;background:#fff;border:1.5px solid var(--line2);border-radius:8px;
  padding:9px 12px;text-align:left;overflow:hidden;transition:border-color .12s}
.pollopt:hover{border-color:var(--blue)}
.pollopt .in{position:relative;z-index:1;display:flex;justify-content:space-between;gap:10px;align-items:center}
.pollopt b{display:block;font-size:13px;font-weight:700}
.pollopt em{font-style:normal;font-size:11.5px;color:var(--dim)}
.choice-arrow{font-size:20px;font-weight:800;color:var(--blue);line-height:1}
.pollnote{font-size:11px;color:var(--dim2)}
.fdelta{color:var(--green);font-weight:700}
.fdelta.down{color:var(--red)}

/* botones */
.btn{background:var(--blue);color:#fff;border:0;border-radius:20px;padding:9px 18px;font-weight:700;font-size:13.5px}
.btn:hover{background:var(--blue2)}
.btn.sec{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}

/* ═══ CREACIÓN ═══ */
.create{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:22px;grid-column:1/-1;max-width:640px;margin:0 auto}
.create-logo{display:block;width:min(210px,62vw);height:auto;margin:0 0 18px}
.create h1{font-size:clamp(26px,6vw,34px);margin:0 0 4px;font-weight:800;letter-spacing:-.02em}
.create h1 em{color:var(--blue);font-style:normal}
.create .sub{color:var(--dim);margin:0 0 18px;font-size:13.5px}
.challenge-banner{background:#E7F5EE;border:1px solid #BFE3CF;border-radius:10px;padding:10px 12px;margin:0 0 14px;font-size:12.5px;color:#0E6B45}
.start-note{text-align:center;color:var(--dim2);font-size:11px;margin:7px 0 0}
.customize{border-top:1px solid var(--line);margin-top:16px;padding-top:12px}
.customize summary{cursor:pointer;color:var(--dim);font-size:12.5px;font-weight:700;text-align:center;list-style:none}
.customize summary::-webkit-details-marker{display:none}
.customize[open] summary{margin-bottom:14px;color:var(--text)}
.customize .btn{width:100%;margin-top:14px}
.fl{margin-bottom:15px}
.fl label{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:700;margin-bottom:7px}
input[type=text]{width:100%;background:#fff;border:1.5px solid var(--line2);border-radius:8px;
  padding:11px 14px;font-size:15px;color:var(--text);font-family:inherit}
input[type=text]:focus{outline:none;border-color:var(--blue)}
.routes{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:9px}
.route{background:#fff;border:1.5px solid var(--line2);border-radius:10px;padding:12px 13px;text-align:left}
.route.sel{border-color:var(--blue);background:#E7F5EE}
.route b{display:block;font-weight:700;margin-bottom:3px;font-size:13px}
.route em{font-style:normal;color:var(--dim);font-size:11.5px;display:block;line-height:1.4}
.gobtn{display:block;width:100%;background:var(--blue);color:#fff;border:0;border-radius:24px;
  padding:13px;font-weight:800;font-size:15px}
.gobtn:hover{background:var(--blue2)}

/* ═══ TARJETA FINAL ═══ */
.cvfinal{grid-column:1/-1;max-width:520px;margin:0 auto;width:100%}
.legadopost .ptxt{font-size:14.5px}
.legadoline{font-size:17px;font-weight:800;margin:8px 0}
.archetype{text-align:center;margin:12px 0;padding:18px 14px;border-radius:12px;background:#E7F5EE;border:1px solid #BFE3CF}
.archetype em{display:block;font-style:normal;font-size:42px;line-height:1}
.archetype b{display:block;margin-top:7px;font-size:21px;line-height:1.2}
.archetype span{display:block;margin-top:5px;color:var(--dim);font-size:12px}
.scoreline{text-align:center;margin:13px 0 11px}
.scoreline b{display:block;font-size:44px;line-height:1;color:var(--brand-ink);letter-spacing:-.05em}
.scoreline span{display:block;margin-top:3px;color:var(--dim2);font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.record{display:inline-block;margin-top:7px;border-radius:14px;padding:3px 9px;background:#FBF3E4;color:var(--gold);font-size:11px;font-weight:800}
.viralstats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}
.viralstat{padding:9px 5px;border:1px solid var(--line);border-radius:9px;text-align:center;background:#F7F6F4}
.viralstat b{display:block;font-size:15px}
.viralstat span{display:block;color:var(--dim2);font-size:9px;text-transform:uppercase;letter-spacing:.06em}
.result-more{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}
.result-more summary{cursor:pointer;list-style:none;text-align:center;color:var(--dim);font-size:11.5px;font-weight:700}
.result-more summary::-webkit-details-marker{display:none}
.result-more[open] summary{margin-bottom:8px}
.cvgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;font-size:12.5px;
  border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
.cvgrid div{display:flex;justify-content:space-between}
.cvgrid span{color:var(--dim)}
.cvgrid b{font-weight:700}
.hitolist{border-top:1px solid var(--line);margin-top:10px;padding-top:9px;font-size:12px;color:var(--dim);line-height:1.6}
.sharebox{text-align:center;margin-top:10px}
.shareactions{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}
/* cabecera de marca */
.topbar{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.topbar .in{max-width:1040px;margin:0 auto;padding:7px 12px;display:flex;align-items:center;gap:9px}
.brand-logo{display:block;width:auto;height:36px;object-fit:contain}
.topbar .tg{margin-left:auto;font-size:11px;color:var(--dim2);font-style:italic;text-align:right}
@media(max-width:560px){.topbar .tg{display:none}.brand-logo{height:32px}}

/* insignias */
.badges{border-top:1px solid var(--line);margin-top:11px;padding-top:10px}
.badges .xh{font-size:12px;font-weight:800;margin-bottom:7px}
.bdgs{display:flex;flex-wrap:wrap;gap:6px}
.bdg{display:inline-flex;align-items:center;gap:5px;background:#F7F6F4;border:1px solid var(--line);
  border-radius:14px;padding:3px 10px 3px 7px;font-size:11px;font-weight:700}
.bdg em{font-style:normal;font-size:13px}
.bdg small{font-weight:600;color:var(--dim2);font-size:10px}
.bdg.green{background:#E7F5EE;border-color:#BFE3CF;color:#0E6B45}

/* posts plegados: "…ver más" */
.ptxt.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:2px}
.vermas{display:inline-block;color:var(--dim2);font-size:12px;font-weight:600;cursor:pointer;margin-bottom:6px}
.vermas:hover{color:var(--blue);text-decoration:underline}

/* aro verde open to work (se activa al quedarte sin trabajo) */
.otw{position:relative;box-shadow:0 0 0 3px #fff,0 0 0 6.5px #46A758!important}
.otw::after{content:'#OPENTOWORK';position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);
  background:#46A758;color:#fff;font-size:6.5px;font-weight:800;letter-spacing:.04em;
  border-radius:6px;padding:1px 4px;white-space:nowrap}
.pavatar.otw::after{font-size:8px;bottom:-8px}

/* comentarios */
.pcomments{border-top:1px solid var(--line);margin-top:7px;padding-top:8px;display:grid;gap:7px}
.pcm{display:flex;gap:7px;align-items:flex-start}
.pcm .cav{width:26px;height:26px;border-radius:50%;flex:0 0 26px;display:grid;place-items:center;
  font-weight:800;font-size:10px;color:#fff}
.pcm .bub{background:#F1F0EE;border-radius:0 10px 10px 10px;padding:6px 10px;font-size:12px;min-width:0}
.pcm .bub b{font-weight:700;font-size:11.5px;display:block}
.pcm.hater .bub{background:#FBE9EA}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
</style>
</head>
<body>
<div class="topbar"><div class="in">
  <img class="brand-logo" src="assets/brand/open2work-logo-v2.png" alt="OPEN2WORK">
  <span class="tg">«Encantado de anunciar que estás<br>a punto de perderlo todo.»</span>
</div></div>
<div class="wrap" id="wrap">
  <div class="rail" id="rail"></div>
  <div class="feedcol" id="feedcol">
    <div id="controls"></div>
    <div id="feed" style="display:contents"></div>
  </div>
</div>

<script>
/* ═════════ PARTIDA REPRODUCIBLE ═════════ */
const GAME_TURNS=8,TURN_YEARS=4;
const START_PARAMS=new URLSearchParams(location.search);
const IS_CHALLENGE=START_PARAMS.has('seed');
const freshSeed=()=>{
  if(globalThis.crypto&&crypto.getRandomValues){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]||1;}
  return (Date.now()>>>0)||1;
};
const parsedSeed=Number.parseInt(START_PARAMS.get('seed')||'',10);
const RUN_SEED=(Number.isFinite(parsedSeed)?parsedSeed:freshSeed())>>>0||1;
let rngState=RUN_SEED;
function rand(){
  let t=rngState+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);
  return ((t^t>>>14)>>>0)/4294967296;
}

/* ═════════ CONSTANTES (mecánica v12) ═════════ */
const LEVELS=[
 {t:'Becario/a',lvl:'L1',xp:0},{t:'Junior',lvl:'L2',xp:14},{t:'Mid-level',lvl:'L3',xp:34},
 {t:'Senior',lvl:'L4',xp:62},{t:'Staff',lvl:'L5',xp:100},{t:'Principal',lvl:'L6',xp:145},
 {t:'Distinguished',lvl:'L7',xp:195},{t:'Head of AI',lvl:'L8',xp:250},
 {t:'VP of AI',lvl:'L9',xp:310},{t:'Chief AI Officer',lvl:'L10',xp:380}];
const MGMT_LEVELS=['','','','Engineering Manager','Senior EM','Director','Senior Director','Head of AI','VP of AI','Chief AI Officer'];
const TRACKS=[
 {id:'res',n:'Investigación',d:'Papers, citas, h-index. La vía académico-industrial.'},
 {id:'ing',n:'Ingeniería ML',d:'Modelos en producción. Lo que de verdad escasea.'},
 {id:'pro',n:'Producto IA',d:'Del modelo al usuario. Quien decide qué se construye.'}];
const FORMACION=[
 {n:'Grado + máster en IA',d:'La ruta estándar. Técnica 42, empiezas a los 23.',tec:42,red:12,age:23},
 {n:'PhD en machine learning',d:'6 años más, técnica 58, red académica, sueldo perdido que no vuelve.',tec:58,red:22,rep:14,age:28,phd:true},

function computeBadges(){

/* ═════════ POSTS ═════════ */
function post({author,tag,tagCls,text,big,mute}){
  const a=typeof author==='function'?author():author;
  const own=a.n===G.name;
  const audience=Math.round(Math.sqrt(G.followers||0)*rnd(1,4));
  const reacts=mute?rnd(1,6):rnd(4,30)+Math.round(G.rep*rnd(2,14))+audience;
  const comments=mute?rnd(0,1):rnd(0,Math.max(2,Math.round(reacts/9)));
  let followerDelta=0,viral=false;
  if(own&&!mute){
    let velocity=Math.max(3,Math.round(reacts*rnd(5,14)/100));
    viral=roll(clamp(3+G.rep/10,3,13));
    if(viral)velocity*=rnd(5,12);
    if(tagCls==='r'&&roll(28))followerDelta=-Math.min(G.followers,Math.max(3,Math.round(velocity*rnd(3,8)/10)));
    else followerDelta=velocity;
    G.followers=Math.max(0,G.followers+followerDelta);
    G.peakFollowers=Math.max(G.peakFollowers,G.followers);
  }
  // comentarios visibles solo en posts propios con tirón
  let cmHtml='';
  if(a.n===G.name&&!mute&&roll(45)){
    const cms=[];
    // los haters llegan con la fama; si no, un aplauso
    if(G.rep>35&&roll(clamp(G.rep-15,10,55)))cms.push({t:pick(HATER_COMMENTS),h:true});
    else if(roll(75))cms.push({t:pick(NICE_COMMENTS),h:false});
    if(cms.length)cmHtml=`<div class="pcomments">${cms.map(c=>{
      const cc=pick(COMMENTERS);
      return `<div class="pcm ${c.h?'hater':''}">
        <div class="cav" style="background:${cc[1]}">${cc[0]}</div>
        <div class="bub"><b>${c.h?'Usuario con opiniones':'Alguien de tu red'}</b>${c.t}</div></div>`;}).join('')}</div>`;
  }
  const d=document.createElement('div');
  d.className='post'+(big?' legadopost':'');
  d.innerHTML=`
    <div class="phd2">
      <div class="pav ${a.sq?'sq':''} ${a.n===G.name&&G.otw?'otw':''}" style="background:${a.col}">${a.ini}</div>
      <div class="pwho">
        <div class="n">${a.n} <small>· ${a===AUTHORS.news||a===AUTHORS.sys?'Siguiendo':'1.º'}</small></div>
        <div class="h">${a.h}</div>
        <div class="t">${G.year} · 🌐</div>
      </div>
    </div>
    ${tag?`<div style="margin-top:8px"><span class="ptag ${tagCls||'b'}">${tag}</span></div>`:''}
    <div class="ptxt${text.length>150?' clamp':''}">${text}</div>
    ${text.length>150?'<span class="vermas">…ver más</span>':''}
    <div class="preact">
      <span><span class="ic">👍💡❤️</span> ${fmtK(reacts)}</span>
      <span>${comments} comentarios · ${rnd(0,Math.round(comments/2)+1)} compartidos${followerDelta?` · <span class="fdelta ${followerDelta<0?'down':''}">${followerDelta>0?'+':'−'}${fmtK(Math.abs(followerDelta))} seguidores${viral?' 🚀':''}</span>`:''}</span>
    </div>
    ${cmHtml}`;
  d.addEventListener('click',e=>{
    if(d.classList.contains('past')&&!e.target.classList.contains('vermas')){d.classList.toggle('expanded');return;}
    if(e.target.classList.contains('vermas')){
      const tx=d.querySelector('.ptxt');
      const open=tx.classList.toggle('clamp');
      e.target.textContent=open?'…ver más':'ver menos';
    }
  });
  const feed=document.getElementById('feed');feed.prepend(d);
  [...feed.children].forEach((p,i)=>{p.classList.toggle('past',i>0);if(i>4)p.remove();});
}

    </div>
  </div>
  </div>`;
}

/* ═════════ CONTROLES ═════════ */
function careerProjects(){
  const candidates=EMPLEADORES.filter(e=>e.n!==G.club.n&&(!e.needPhd||G.phd)&&e.tier>=G.club.tier&&e.tier<=Math.min(4,G.club.tier+1));
  const fallback=EMPLEADORES.filter(e=>e.n!==G.club.n&&(!e.needPhd||G.phd));
  const target=pick(candidates.length?candidates:fallback);
  return [
    {id:'jump',ic:'🏆',kind:'Jugar a ganar',t:'Intentar el salto a '+target.n,
      e:'Más nombre, más presión. La puerta está abierta; el resultado, no.',target},
    {id:'stay',ic:'⚖️',kind:'Consolidar',t:'Seguir en '+G.club.n,
      e:'Conoces el proyecto y sus grietas. La continuidad también compone.'},
    {id:'build',ic:'🛠️',kind:'Construir',t:G.side?'Doblar la apuesta por '+G.side.n:'Lanzar algo con tu nombre',
      e:'Menos organigrama, más exposición. Puede ser hobby o convertirse en tu carrera.'}
  ];
}
function signed(v,suffix=''){const n=Math.round(v);return (n>0?'+':'')+n+suffix;}
function chooseProject(i){
  const route=G.routes&&G.routes[i];if(!route)return;
  G.routes=null;document.getElementById('controls').onclick=null;
  if(route.id==='stay'){
    G.energy=clamp(G.energy+8,0,100);G.xp+=4;
    post({author:AUTHORS.me,tag:'CONTINUIDAD',tagCls:'b',text:'He decidido seguir en <b>'+G.club.n+'</b>. No todo movimiento necesita un logo nuevo: a veces la apuesta es quedarse cuando ya conoces las grietas.'});
  }
  if(route.id==='jump'){
    const o=route.target,gap=Math.max(0,o.tier-G.club.tier);
    const p=clamp(48+(G.tec-o.minTec)*1.05+(G.rep-o.minRep)*.65-gap*7,14,90),win=roll(p);
    if(win){
      G.club=o;if(!G.clubs.includes(o.n))G.clubs.push(o.n);xpStart(o.n);
      G.salary=Math.round(offerComp(o));G.equity+=o.eq;G.manager=pick(MANAGERS);G.energy=clamp(G.energy-7,0,100);G.red=clamp(G.red+5,0,100);
      post({author:AUTHORS.me,tag:'NUEVO PROYECTO',tagCls:'g',text:'Me lancé a por <b>'+o.n+'</b> y conseguí el asiento. En LinkedIn lo llamaré una decisión meditada; hubo bastante vértigo.'+oddsLine(p,true)});
    }else{
      G.energy=clamp(G.energy-5,0,100);G.rep=clamp(G.rep+1,0,100);
      post({author:AUTHORS.me,tag:'PUERTA CERRADA',tagCls:'r',text:'Intenté dar el salto a <b>'+o.n+'</b>. Llegué lejos, pero el correo terminó con «hemos decidido avanzar con otros perfiles».'+oddsLine(p,false)});
    }
  }
  if(route.id==='build'){
    G.energy=clamp(G.energy-7,0,100);G.rep=clamp(G.rep+3,0,100);G.red=clamp(G.red+6,0,100);
    if(G.side){
      const gained=Math.max(40,Math.round(G.side.subs*(.35+rand()*.55)));G.side.subs+=gained;
      post({author:AUTHORS.me,tag:'CONSTRUIR EN PÚBLICO',tagCls:'p',text:'He decidido doblar la apuesta por <b>'+G.side.n+'</b>. +'+fmtK(gained)+' '+G.side.unit+'. Ya no sé si es un side project o mi plan de fuga.'});
    }else{
      G.side={...pick([
        {n:'Tu micro-SaaS',type:'saas',subs:12,unit:'clientes'},
        {n:'Tu librería OSS',type:'oss',subs:80,unit:'★'},
        {n:'Tu newsletter',type:'news',subs:40,unit:'suscriptores'}])};
      post({author:AUTHORS.me,tag:'CONSTRUIR EN PÚBLICO',tagCls:'p',text:'He lanzado <b>'+G.side.n.toLowerCase()+'</b>. Es pequeño, imperfecto y por primera vez el roadmap no lo decide un comité.'});
    }
  }
  playYear();
}
function renderControls(){
  if(G.retired||!G.track)return;
  if(G.pendingEvent){document.getElementById('controls').innerHTML='';return;}
  if(!G.routes)G.routes=careerProjects();
  const s=G.lastCycle;
  document.getElementById('controls').innerHTML=`
  ${s?`<div class="cyclecard"><span class="years">${s.from}–${s.to}</span><span class="summary"><b>${s.club}</b><span class="deltas">${signed(s.tec,' técnica')} · ${signed(s.followers,' seguidores')} · ${signed(s.energy,' energía')}</span></span></div>`:''}
  <div class="careerpick">
    <div class="careerhead"><div><span>Etapa ${G.turns+1} de ${GAME_TURNS}</span><b>Elige tu próximo proyecto</b></div><em>${G.year+1}–${G.year+TURN_YEARS}</em></div>
    <div class="careeropts">${G.routes.map((r,i)=>`<button class="careeropt" data-route="${i}">
      <span class="ico">${r.ic}</span><span class="copy"><span class="kind">${r.kind}</span><b>${r.t}</b><small>${r.e}</small></span><span class="arr">→</span>
    </button>`).join('')}</div>
  </div>
  ${G.turns>=6?'<div style="text-align:center"><button class="retirebtn" id="ret">Retirarte antes de tiempo</button></div>':''}`;
  document.getElementById('controls').onclick=e=>{const b=e.target.closest('[data-route]');if(b)chooseProject(+b.dataset.route);};
  const retire=document.getElementById('ret');if(retire)retire.onclick=finalCard;
}
const renderAll=()=>{renderRail();renderControls();};
const finishOrRender=()=>G.turns>=GAME_TURNS?finalCard():renderAll();

/* ═════════ AÑO ═════════ */
function playYear(){
  const cycleStart={year:G.year,tec:G.tec,followers:G.followers,energy:G.energy};
  G.turns++;G.age+=TURN_YEARS;G.year+=TURN_YEARS;
  if(G.otw){G.otw=false;
    post({author:AUTHORS.sys,tag:'RECORDATORIO',tagCls:'g',mute:true,
      text:'Llevabas un tiempo con el aro verde puesto. Ya tienes trabajo. Te lo quitamos nosotros, no pasa nada, le pasa a todo el mundo. 🟢✂️'});}
  let ownLines=[];      // se agrupan en UN post tuyo
  let ownTag=null,ownTagCls='b';

  // mercado
  const prev=G.market;
  if(roll(48))G.market=pick(MK_NEXT[G.market]);
  if(G.market!==prev){
    post({author:AUTHORS.news,tag:'ÚLTIMA HORA',tagCls:{boom:'g',est:'b',inv:'r',reg:'o',agi:'p'}[G.market],
      text:'<b>'+MK().n+'.</b> '+MK().d+'. Analistas del sector: "esta vez es diferente" (misma frase que el ciclo anterior).'});
  }

  // equity con mercado durante el salto temporal
  if(G.equity>0){
    const k=Math.pow(MK().eqK,1.7)+(rand()*.12-.06);
    const d0=Math.round(G.equity);G.equity*=k;
    const diff=Math.round(G.equity)-d0;
    if(Math.abs(diff)>=8)ownLines.push('Mi equity '+(diff>0?'sube':'cae')+' '+Math.abs(diff)+'k€ con el mercado. '+(diff>0?'No es dinero hasta que no es dinero.':'Respira. Solo es papel.'));
  }

  // manager
  if(G.manager){
    G.xp+=G.manager.xp;G.energy=clamp(G.energy+G.manager.ene,0,100);
    if(G.manager.tec)G.tec=clamp(G.tec+G.manager.tec,10,99);
    if(roll(18)){G.manager=pick(MANAGERS);
      post({author:AUTHORS.hr,tag:'REORG',tagCls:'p',
        text:'Comunicado interno: nueva reorganización para "alinear estructuras con la estrategia". Traducción: te cambia el manager. Ahora tienes '+G.manager.n+' ('+G.manager.d.toLowerCase()+').'});}
  }

  // técnica y energía
  let dt=((G.age<30?3.2:G.age<38?1.6:.6)+({corp:0,startup:.8,bigtech:1,frontier:2,academia:.6}[G.club.type]))*3.2;
  if(G.mgmt)dt-=3.2;
  if(G.energy<32){dt-=3.6;ownTag='RINDIENDO BAJO MÍNIMOS';ownTagCls='r';}
  G.tec=clamp(G.tec+dt+rand()*2-.7,10,99);
  G.energy=clamp(G.energy-(3+({corp:1,startup:5,bigtech:3,frontier:6,academia:2}[G.club.type]))*1.7+rand()*8,0,100);

  // XP y promo
  G.xp+=(4+G.club.tier*2+(G.tec>70?3:0)+(G.mgmt?3:0))*4;
  const before=G.levelIdx;level();
  if(G.levelIdx>before){
    G.salary=Math.round(G.salary*1.18);G.rep=clamp(G.rep+4,0,100);
    G.hitos.push('Promo a '+levelName()+' ('+G.year+')');
    post({author:AUTHORS.me,tag:'PROMOCIÓN',tagCls:'g',
      text:'Me emociona compartir que asumo el rol de <b>'+levelName()+'</b> ('+LEVELS[G.levelIdx].lvl+') 🎉\n\nSolo puedo dar las gracias al equipo. El título tarda 3 semanas en aparecer en la firma del email, pero la ilusión ya está aquí. #Growth'});
  }

  // producción → post propio
  if(!G.mgmt){
    const out=Math.max(0,Math.round(((G.tec-30)/16)*2+(rand()*2-.5)));
    if(G.track.id==='res'){
      G.papers+=out;const c=out*Math.round(G.tec*1.9);G.citas+=c;
      G.hindex=Math.min(G.papers,Math.round(Math.sqrt(G.citas/9)));
      ownLines.unshift(out>0?'Este año: <b>'+out+' paper'+(out>1?'s':'')+'</b> publicados y +'+c+' citas (h-index '+G.hindex+'). El revisor 2 sigue sin quererme, pero las citas no mienten.':'Año sin publicar. A veces el mejor paper es el que no escribes. (Es mentira, estoy fatal.)');
      if(out>0&&G.tec>72&&roll(28)){G.hitos.push('Best paper ('+G.year+')');G.rep=clamp(G.rep+8,0,100);
        post({author:AUTHORS.news,tag:'PREMIO',tagCls:'o',text:'<b>'+G.name+'</b> gana el best paper de la conferencia grande del año. Su hilo explicándolo tiene más citas que el paper.'});}
    } else {
      G.products+=out;const s=out*Math.round(G.tec*14);G.stars+=s;G.citas+=out*Math.round(G.tec/6);
      ownLines.unshift(out>0?'Balance del año: <b>'+out+' producto'+(out>1?'s':'')+'</b> en producción y +'+s+' ★ en GitHub. Detrás de cada demo bonita hay un try/except del que no hablo.':'Año de deuda técnica y reuniones. Alguien tenía que hacerlo, y ese alguien no sale en las keynotes.');
      if(out>0&&G.tec>72&&roll(26)){G.hitos.push('Producto del año ('+G.year+')');G.rep=clamp(G.rep+7,0,100);
        post({author:AUTHORS.news,tag:'DESTACADO',tagCls:'o',text:'El lanzamiento de <b>'+G.name+'</b> aparece en todas las newsletters del sector esta semana. Sí, en esa también.'});}
    }
  } else {
    G.rep=clamp(G.rep+2,0,100);
    ownLines.unshift('Un año más liderando al equipo. Mi contribución ya no se mide en commits, sino en que nadie dimita. Spoiler: nadie ha dimitido. 📈');
  }

  // side project
  if(G.side){
    const gr=Math.round(G.side.subs*(.32+rand()*.7))+40;
    G.side.subs+=gr;
    const inc=Math.round(G.side.subs/(G.side.type==='saas'?60:200));
    if(inc>2){G.vested+=inc;ownLines.push('⚡ '+G.side.n+': +'+gr+' '+G.side.unit+' este año y '+inc+'k€ de ingreso extra. Construir en público funciona (y da un miedo horrible).');}
    G.energy=clamp(G.energy-3,0,100);
  }

  // reputación y charlas
  G.rep=clamp(G.rep+(G.tec>65?2:1)+(G.club.tier>=3?1:0),0,100);
  if(G.rep>=45&&roll(G.rep-20)){G.talks++;G.red=clamp(G.red+4,0,100);
    ownLines.push('Di una charla en la conferencia del sector. Las slides me llevaron 3 semanas; el "¿se ve mi pantalla?", 3 segundos.');}

  // vesting
  if(G.equity>0){const v=Math.round(G.equity*.45);G.vested+=v;G.equity-=v;}

  G.salary=Math.round(G.salary*1.12);
  G.maxComp=Math.max(G.maxComp,comp());

  // post propio del año — máx 2 frases, con la energía baja el tono cambia
  if(G.energy<35&&roll(60)){
    ownLines=[ownLines[0]||'',
      'Voy a ser honest'+(rand()<.5?'o':'a')+': este año ha sido duro. El feed solo enseña las promos; detrás hay domingos con el estómago cerrado. Si estás igual: no estás solo.'];
    ownTag=ownTag||'POST VULNERABLE';ownTagCls='r';
  }
  post({author:AUTHORS.me,tag:ownTag,tagCls:ownTagCls,text:ownLines.filter(Boolean).slice(0,2).join('\n\n')});

  // uno o dos giros raros por carrera: sorpresa sin otra capa de controles
  const twistP=G.turns>=7&&G.twists<2?60:G.turns>=4&&G.twists===0?40:14;
  if(G.twists<2&&roll(twistP))plotTwist();

  // ruido del feed: la carrera de los demás también existe (y duele)
  if(roll(20))ambientPost();

  G.lastCycle={from:cycleStart.year+1,to:G.year,club:G.club.n,tec:G.tec-cycleStart.tec,
    followers:G.followers-cycleStart.followers,energy:G.energy-cycleStart.energy};

  // Los proyectos mueven la carrera; los eventos quedan como dilemas excepcionales.
  if(G.turns<GAME_TURNS&&roll(42))queueEvent();

  if(G.turns>=GAME_TURNS&&!G.pendingEvent)return finalCard();
  renderAll();renderPending();
}

function plotTwist(){
  const pool=TWISTS.filter(t=>!G.used['twist_'+t.id]&&(!t.cond||t.cond()));
  if(!pool.length)return;
  const t=pick(pool);G.used['twist_'+t.id]=true;G.twists++;t.run();
}

function queueEvent(){
  const pool=[];
  EVENTS.forEach(e=>{
    if(e.once&&G.used[e.id])return;
    if(e.cond&&!e.cond())return;
    for(let i=0;i<(e.w||1);i++)pool.push(e);
  });
  if(!pool.length)return;
  const ev=pick(pool);
  G.used[ev.id]=true;G.pendingEvent=ev;
}
function renderPending(){
  if(G.pendingEvent)return renderEvent();
}

/* decisión como encuesta */
function renderEvent(){
  const ev=G.pendingEvent;
  document.getElementById('controls').innerHTML=`
  <div class="post poll">
    <div class="phd2">
      <div class="pav sq" style="background:${AUTHORS.sys.col}">${AUTHORS.sys.ini}</div>
      <div class="pwho"><div class="n">${AUTHORS.sys.n}</div>
      <div class="h">${ev.k} · decisión de carrera</div><div class="t">Ahora mismo</div></div>
    </div>
    <div class="ptxt"><b>${ev.h}</b>\n${ev.p}</div>
    <div class="pollopts">${ev.o.map((o,i)=>`
      <button class="pollopt" data-e="${i}">
        <span class="in"><span><b>${o.t}</b><em>${o.e}</em></span>
        <span class="choice-arrow">→</span></span>
      </button>`).join('')}
    </div>
    <div class="pollnote">Decide por instinto. Las consecuencias no avisan.</div>
  </div>`;
  document.getElementById('controls').onclick=e=>{
    const b=e.target.closest('[data-e]');if(!b)return;
    resolveEvent(ev.o[+b.dataset.e]);
  };
}
function resolveEvent(o){
  const win=roll(o.pr);
  const r=win?o.ok:(o.ko||o.ok);
  if(r.tec)G.tec=clamp(G.tec+r.tec,10,99);
  if(r.energy)G.energy=clamp(G.energy+r.energy,0,100);
  if(r.rep)G.rep=clamp(G.rep+r.rep,0,100);
  if(r.red)G.red=clamp(G.red+r.red,0,100);
  if(r.xp)G.xp+=r.xp;
  if(r.sal)G.salary=Math.round(G.salary*r.sal);
  if(r.money)G.vested+=r.money;
  if(r.eq)G.equity+=r.eq;
  if(r.eqmul)G.equity=Math.round(G.equity*r.eqmul);
  if(r.eqzero)G.equity=0;
  if(r.cashout){G.vested+=Math.round(G.equity);G.hitos.push('Adquisición: equity cobrado ('+G.year+')');G.equity=0;}
  if(r.cashhalf){G.vested+=Math.round(G.equity/2);G.equity=Math.round(G.equity/2);G.hitos.push('Venta parcial de equity ('+G.year+')');}
  if(r.vest){G.vested+=r.vest;G.hitos.push('Exit de startup ('+G.year+')');G.exits++;}
  if(r.book)G.hitos.push('Libro de referencia ('+G.year+')');
  if(r.mgmt){G.mgmt=true;G.hitos.push('Cambio a vía de gestión ('+G.year+')');}
  if(r.side)G.side=r.side;
  if(r.sideMul&&G.side)G.side.subs=Math.round(G.side.subs*r.sideMul);
  if(r.sideSell&&G.side){G.vested+=Math.round(G.side.subs/8);G.hitos.push('Side project vendido ('+G.year+')');G.side=null;}
  if(r.sideKill)G.side=null;
  if(r.newMgr)G.manager=pick(MANAGERS.filter(m=>m.q!=='bad'));
  if(r.burnout){G.burnouts++;G.hitos.push('Baja por burnout ('+G.year+')');}
  if(r.scandal)G.scandals++;
  const tag=r.tag||(win?'SALIÓ BIEN':'SALIÓ MAL');
  const tagCls=r.tagCls||(win?'g':'r');
  if(r.quit||r.layoff){
    if(r.layoff&&!r.quit){G.layoffs++;G.otw=true;}
    if(!r.soft&&!r.quit)G.energy=clamp(G.energy-12,0,100);
    post({author:AUTHORS.me,tag,tagCls,text:r.txt+oddsLine(o.pr,win)});
    if(!r.quit){
      const fb=EMPLEADORES.filter(e=>G.tec>=e.minTec&&G.rep>=e.minRep&&e.n!==G.club.n&&(!e.needPhd||G.phd));
      const nx=fb.sort((a,b)=>b.tier-a.tier)[Math.min(1,fb.length-1)]||EMPLEADORES[0];
      G.club=nx;if(!G.clubs.includes(nx.n))G.clubs.push(nx.n);
      xpStart(nx.n);
      G.salary=Math.round(nx.base*(1+G.tec/150)*MK().sal);G.equity+=nx.eq;G.manager=pick(MANAGERS);
      post({author:AUTHORS.me,tag:'NUEVA ETAPA',tagCls:'b',
        text:'Tras unos meses de reflexión (y de mirar el techo), ¡encantad'+(rand()<.5?'o':'a')+' de anunciar que me uno a <b>'+nx.n+'</b>! La vida sigue, con más cinismo y mejor CV. #NewBeginnings'});
    } else {
      G.club={n:'Tu propio proyecto',tier:2,type:'startup',base:30,eq:0};
      G.clubs.push('Tu propio proyecto');G.salary=30;G.manager=null;
      xpStart('Tu propio proyecto');
    }
    G.pendingEvent=null;finishOrRender();return;
  }
  post({author:AUTHORS.me,tag,tagCls,text:r.txt+oddsLine(o.pr,win)});
  G.pendingEvent=null;finishOrRender();
}

/* compensación estimada para los proyectos disponibles */
function offerComp(o){return Math.round(o.base*(1+G.tec/140)*(1+G.levelIdx*.06)*MK().sal);}

function careerArchetype(score){
  if(G.scandals>=2)return {ic:'🃏',n:'Gurú cancelado',d:'Tu carrera sobrevivió a tus propias opiniones. Internet no olvida.'};
  if(G.exits>0)return {ic:'🦄',n:'Millonario accidental',d:'Dijiste que era visión. También hubo una cantidad obscena de suerte.'};
  if(G.followers>=10000)return {ic:'📣',n:'Monstruo del algoritmo',d:'Cada cambio de empleo fue también una campaña de contenidos. La audiencia vino por el drama y se quedó por el CV.'};
  if(G.layoffs>=3)return {ic:'🟢',n:'Eterno Open to Work',d:'Te echaron varias veces. Volviste todas. El aro ya forma parte de tu marca.'};
  if(G.burnouts>=2)return {ic:'🔥',n:'Talento en combustión',d:'Llegaste lejos, aunque tu calendario y tu sistema nervioso pagaron el viaje.'};
  if(G.side&&G.side.subs>8000)return {ic:'⚡',n:'Imperio de domingo',d:'Lo que empezó fuera de horario terminó siendo lo más importante.'};
  if(G.clubs.length>=6)return {ic:'🧳',n:'Nómada del organigrama',d:'Tu mayor habilidad fue saber exactamente cuándo cambiar de logo.'};
  if(G.mgmt&&G.levelIdx>=8)return {ic:'👔',n:'Criatura del comité',d:'Ya no escribes código: escribes documentos que deciden quién lo escribe.'};
  if(G.track.id==='res'&&G.hindex>=25)return {ic:'🎓',n:'Eminencia con Reviewer 2',d:'Te citan miles. El revisor 2 sigue pidiendo otro experimento.'};
  if(G.vested>=500)return {ic:'💰',n:'Excel con libertad financiera',d:'Convertiste decisiones de carrera en celdas sorprendentemente verdes.'};
  if(G.levelIdx>=8)return {ic:'🧠',n:'Leyenda técnica',d:'Subiste sin fingir que tu pasión eran las reuniones de presupuesto.'};
  if(G.energy>=70&&score>=120)return {ic:'🧘',n:'Carrera sospechosamente sana',d:'Progresaste y conservaste energía. Recursos Humanos quiere estudiar tu caso.'};
  if(score>=180)return {ic:'🚀',n:'Cohete profesional',d:'Promociones, visibilidad y una relación peligrosamente buena con el algoritmo.'};
  return {ic:'🪜',n:'Escalador con dignidad',d:'No conquistaste el sector, pero tampoco dejaste que el sector te conquistara.'};
}

function challengeLink(){
  if(!/^https?:/.test(location.href))return '';
  const u=new URL(location.href);u.search='';u.hash='';
  u.searchParams.set('seed',String(RUN_SEED));u.searchParams.set('track',C.track);u.searchParams.set('form',String(C.form));
  return u.toString();
}

function buildShareCard({arch,score,url}){
  const canvas=document.createElement('canvas');canvas.width=1080;canvas.height=1080;
  const x=canvas.getContext('2d'),grad=x.createLinearGradient(0,0,1080,1080);
  grad.addColorStop(0,'#14201B');grad.addColorStop(1,'#0E6B45');x.fillStyle=grad;x.fillRect(0,0,1080,1080);
  x.fillStyle='#16B86A';x.beginPath();x.arc(910,130,210,0,Math.PI*2);x.fill();
  x.fillStyle='#FFFFFF';x.font='900 58px Inter, Arial';x.fillText('OPEN2WORK',72,100);
  x.fillStyle='#8DDEB3';x.font='700 24px Inter, Arial';x.fillText('TU CARRERA EN IA',75,145);
  x.textAlign='center';x.font='110px Arial';x.fillText(arch.ic,540,340);
  x.fillStyle='#FFFFFF';x.font='900 64px Inter, Arial';x.fillText(arch.n,540,430);
  x.fillStyle='#8DDEB3';x.font='900 170px Inter, Arial';x.fillText(String(score),540,640);
  x.fillStyle='#FFFFFF';x.font='800 26px Inter, Arial';x.fillText('PUNTOS',540,685);
  const stats=[[fmtK(G.followers),'SEGUIDORES'],[G.maxComp+'k€','COMP. MÁXIMA'],[String(G.layoffs),'DESPIDOS']];
  stats.forEach((s,i)=>{const cx=220+i*320;x.fillStyle='rgba(255,255,255,.10)';x.fillRect(cx-125,745,250,120);x.fillStyle='#FFFFFF';x.font='900 38px Inter, Arial';x.fillText(s[0],cx,795);x.fillStyle='#8DDEB3';x.font='700 17px Inter, Arial';x.fillText(s[1],cx,835);});
  x.fillStyle='#FFFFFF';x.font='800 28px Inter, Arial';x.fillText('¿PUEDES HACERLO MEJOR?',540,950);
  x.fillStyle='#8DDEB3';x.font='500 18px Inter, Arial';x.fillText(url?new URL(url).host:'open2work',540,995);
  return new Promise((resolve,reject)=>canvas.toBlob(blob=>blob?resolve(new File([blob],'open2work-'+score+'.png',{type:'image/png'})):reject(new Error('No se pudo crear la tarjeta')),'image/png'));
}

/* ═════════ TARJETA FINAL ═════════ */
function finalCard(){
  G.retired=true;
  const L=LEVELS[G.levelIdx],sideBonus=G.side?Math.min(25,G.side.subs/400):0;
  const score=Math.round(G.tec*.8+G.rep*1.1+G.red*.5+G.levelIdx*14+G.exits*35+G.talks*2
    +Math.min(30,G.vested/40)+Math.min(35,Math.log10(G.followers+1)*8)+sideBonus-G.scandals*28-G.burnouts*10);
  let legado;
  if(G.scandals>0&&G.rep<40)legado='La historia que se cuenta en los offsites';
  else if(G.side&&G.side.subs>8000)legado='El imperio que empezó un domingo';
  else if(G.exits>0&&score>=200)legado='Libertad financiera con opiniones';
  else if(G.mgmt&&G.levelIdx>=8)legado='La silla desde la que se decide';
  else if(G.levelIdx>=8)legado='Leyenda de la vía técnica';
  else if(score>=230)legado='Referente del sector';
  else if(G.track.id==='res'&&G.hindex>=25)legado='Eminencia citada y querida';
  else if(score>=160)legado='Carrera de las que se estudian';
  else if(G.burnouts>=2)legado='Brillante, a un coste que nadie vio';
  else if(score>=110)legado='Profesional sólido, vida entera';
  else legado='Un CV honesto en un sector ruidoso';

  const arch=careerArchetype(score),shareUrl=challengeLink();
  const shareText=`Me salió ${arch.ic} ${arch.n} con ${score} puntos y ${fmtK(G.followers)} seguidores en OPEN2WORK. ¿Puedes superar mi carrera?`;
  const share=shareText+(shareUrl?'\n'+shareUrl:'');
  let previousBest=0;try{previousBest=Number(localStorage.getItem('open2work-best'))||0;}catch(err){}
  const isRecord=score>previousBest,best=Math.max(score,previousBest);
  if(isRecord)try{localStorage.setItem('open2work-best',String(score));}catch(err){}

  document.getElementById('wrap').innerHTML=`
  <div class="cvfinal">
    <div class="post legadopost" style="border-left:4px solid var(--blue)">
      <div class="phd2">
        <div class="pav" style="background:linear-gradient(135deg,#16B86A,#0E6B45)">${G.ini}</div>
        <div class="pwho"><div class="n">${G.name} <small>· Fin de carrera</small></div>
        <div class="h">${L.lvl} · ${levelName()} — ${G.track.n}</div><div class="t">Resultado final · semilla ${RUN_SEED}</div></div>
      </div>
      <div class="archetype"><em>${arch.ic}</em><b>${arch.n}</b><span>${arch.d}</span></div>
      <div class="scoreline"><b class="num">${score}</b><span>puntos</span><div class="record">${isRecord?'🏆 Nuevo récord personal':'Récord personal: '+best}</div></div>
      <div class="viralstats">
        <div class="viralstat"><b>${fmtK(G.followers)}</b><span>Seguidores</span></div>
        <div class="viralstat"><b>${G.maxComp}k€</b><span>Comp. máxima</span></div>
        <div class="viralstat"><b>${G.layoffs}</b><span>Despidos</span></div>
      </div>
      <div class="legadoline" style="text-align:center">«${legado}»</div>
      <details class="result-more"><summary>Ver carrera completa</summary>
        <div class="cvgrid">
          <div><span>Edad final</span><b>${G.age}</b></div><div><span>Energía</span><b>${Math.round(G.energy)}</b></div>
          <div><span>Técnica</span><b>${Math.round(G.tec)}</b></div><div><span>Reputación</span><b>${Math.round(G.rep)}</b></div>
          <div><span>Pico de seguidores</span><b>${fmtK(G.peakFollowers)}</b></div><div><span>Empresas</span><b>${G.clubs.length}</b></div>
          <div><span>Cobrado</span><b>${G.vested}k€</b></div><div><span>Giros</span><b>${G.twists}</b></div>
        </div>
        <div class="hitolist">${G.hitos.length?G.hitos.slice(-5).map(h=>'· '+h).join('<br>'):'· Sin hitos con titular.'}<br><span style="color:var(--dim2)">${G.clubs.join(' → ')}</span></div>
      </details>
    </div>
    <div class="sharebox"><div class="shareactions">
      <button class="btn" id="share" data-url="${shareUrl}">Retar a alguien</button><button class="btn sec" id="again">Otra vida</button>
    </div></div>
  </div>`;

  const cardPromise=buildShareCard({arch,score,url:shareUrl});
  document.getElementById('share').onclick=async()=>{
    const btn=document.getElementById('share');
    try{
      const card=await cardPromise;
      if(navigator.share){
        const payload={title:'OPEN2WORK',text:shareText};if(shareUrl)payload.url=shareUrl;
        if(navigator.canShare&&navigator.canShare({files:[card]}))payload.files=[card];
        await navigator.share(payload);
      }else{
        const a=document.createElement('a');a.href=URL.createObjectURL(card);a.download=card.name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
        await navigator.clipboard.writeText(share);btn.textContent='¡Reto copiado!';
      }
    }catch(err){
      if(err.name!=='AbortError')navigator.clipboard.writeText(share).then(()=>btn.textContent='¡Reto copiado!').catch(()=>{});
    }
  };
  document.getElementById('again').onclick=()=>{
    sessionStorage.setItem('open2work-replay',JSON.stringify({name:G.name,track:pick(TRACKS).id,form:rnd(0,FORMACION.length-1)}));
    const next=new URL(location.href);next.search='';next.hash='';location.assign(next.toString());
  };
}

let replay=null;
try{replay=JSON.parse(sessionStorage.getItem('open2work-replay'));sessionStorage.removeItem('open2work-replay');}catch(err){}
if(replay&&typeof replay.name==='string'){
  C.name=replay.name;
  if(TRACKS.some(t=>t.id===replay.track))C.track=replay.track;
  if(Number.isInteger(replay.form)&&FORMACION[replay.form])C.form=replay.form;
  creation();startCareer();
}else creation();
</script>
